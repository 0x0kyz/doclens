<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocLens Demo</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f0f0f5;
        color: #1d1d1f;
        padding: 24px;
      }
      h1 { font-size: 28px; margin-bottom: 4px; }
      .subtitle { color: #6e6e73; font-size: 15px; margin-bottom: 24px; }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        align-items: center;
      }
      .controls button {
        padding: 8px 16px;
        border: 1px solid #d2d2d7;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.15s;
      }
      .controls button:hover { background: #f5f5f7; }
      .controls button.active {
        background: #0071e3;
        color: #fff;
        border-color: #0071e3;
      }
      .controls label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: #6e6e73;
      }
      .controls input[type="file"] { font-size: 13px; }
      .theme-toggle {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }
      #viewer-root {
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      }
    </style>
  </head>
  <body>
    <h1>DocLens</h1>
    <p class="subtitle">Universal Document Viewer — supports PDF, XLSX, CSV, DOCX, PPTX, XML, JSON, HTML, Markdown, images, video, audio, and plain text</p>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
